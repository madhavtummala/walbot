algorithms:
  bursty_dca:
    regime_ma_days: 200
    percent_b_lookback: 20
    percent_b_threshold: 0.0
    rsi_lookback: 2
    rsi_threshold: 10.0
    max_trade_multiple: 3.0
    max_monthly_multiple: 3.0
    value_averaging: true
  fast_momentum:
    risk_on_universe:
    - QQQM
    - XSD
    - PBD
    - AIQ
    - IBIT
    - USO
    - IEMG
    - HYG
    - GLD
    - GTEK
    - BBC
    - GVIP
    defensive_universe:
    - BIL
    - IEF
    - AGG
    - TLT
    max_positions: 4
    max_single_position_weight: 0.5
    max_gross_exposure: 0.95
    min_score_delta_to_replace: 0.1
    pullback_min_micro_return: -0.02
    min_risk_on_micro_return: 0.01
  dual_momentum:
    # Thirteen distinct themes, all liquid enough to trade on a 15-minute cadence. PBD, GTEK,
    # BBC and GVIP were dropped for liquidity (all under ~$0.02M/day on the IEX feed against
    # QQQM's $13M -- the algorithm was selecting names it could not actually fill), and AIQ
    # for redundancy (0.95 correlation with QQQM: one trade, not two themes).
    risk_on_universe:
    - QQQM   # US megacap tech
    - XSD    # semiconductors
    - XBI    # biotech
    - XOP    # energy E&P
    - KRE    # regional banks
    - XRT    # retail
    - IJH    # US mid cap
    - IEMG   # emerging markets
    - EWJ    # Japan
    - VGK    # Europe
    - GLD    # gold
    - IBIT   # bitcoin
    - USO    # oil
    defensive_universe:
    - SGOV
    benchmark: QQQM
    breadth_min: 0.5
    regime_confirm_bars: 2
    regime_exit_confirm_bars: 2
    etf_min_abs_return: 0
    etf_min_fast_return: -0.02
    risk_adjusted_score: true
    max_positions: 5
    entry_rank_max: 5
    exit_rank_max: 7
    min_base_score: 0.25
    min_score_delta_to_replace: 0.35
    momentum_change_enter: 0
    cooldown_after_exit: 4
    name_weight_max: 0.35
    risk_on_gross_max: 1
    target_portfolio_vol: 0.3
    high_vol_trigger: 1.3
    intraday_drawdown_limit: -0.015
    sentiment_size_scale: 0
  invest_spy:
    spy_symbol: SPY
    equity_income_universe:
    - XYLD
    - GPIX
    defensive_universe:
    - BIL
    crisis_hedge_universe:
    - SH
    - VXX
    flat_equity_income_exposure: 0.5
    max_crisis_hedge_exposure: 0.15
