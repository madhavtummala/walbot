algorithms:
  bursty_dca:
    regime_ma_days: 200
    percent_b_lookback: 20
    percent_b_threshold: 0.0
    rsi_lookback: 2
    rsi_threshold: 10.0
    # Both clamps are stated in multiples of the MONTHLY budget, not the per-run increment.
    max_trade_multiple: 3.0
    max_monthly_multiple: 3.0
    value_averaging: true
  fast_momentum:
    risk_on_universe:
    - QQQM
    - XSD
    - PBD
    - AIQ
    - IBIT
    - USO
    - IEMG
    - HYG
    - GLD
    - GTEK
    - BBC
    - GVIP
    defensive_universe:
    - BIL
    - IEF
    - AGG
    - TLT
    max_positions: 4
    max_single_position_weight: 0.5
    max_gross_exposure: 0.95
    min_score_delta_to_replace: 0.10
    pullback_min_micro_return: -0.02
    min_risk_on_micro_return: 0.01
  # Read as `spy_rotation`; the key is kept so saved tuning survives the renames.
  invest_spy:
    spy_symbol: SPY
    equity_income_universe:
    - XYLD
    - GPIX
    defensive_universe:
    - BIL
    crisis_hedge_universe:
    - SH
    - VXX
    flat_equity_income_exposure: 0.5
    max_crisis_hedge_exposure: 0.15
