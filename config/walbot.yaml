algorithm_bot:
  trading_account_id: alpaca1
  backtest_period: 3m
algorithms:
  bursty_dca:
    account_id: schwab1
    enabled: false
    cron: 0 11 * * 1-5
    regime_ma_days: 150
    scaling_factor: 0.5
    max_monthly_multiple: 3
    relax_months: 3
    relax_depth: 0.7
    plan:
      buy:
        amount: 1500
        items:
        - symbol: XBI
          amount: 150
        - symbol: GTEK
          amount: 150
        - symbol: QQQM
          amount: 400
        - symbol: IAUM
          amount: 400
        - symbol: SPYM
          amount: 400
      sell:
        amount: 0
        items: []
  rally_rotation:
    account_id: local_paper
    enabled: false
    cron: '*/30 10-15 * * 1-5'
    risk_on_universe:
    - QQQM
    - XSD
    - XBI
    - VEA
    - USO
    - IAUM
    - IEMG
    - SLV
    - KRE
    - XRT
    - IWM
    - IBIT
    defensive_universe:
    - SGOV
    max_positions: 3
    entry_rank_max: 3
    exit_rank_max: 6
    rerank_interval_days: 5
    entry_min_eligible_days: 1
    volatility_tilt: -0.5
    vol_ceiling: 0.5
    rebalance_weight_threshold: 0.08
    nano_days: 1
    micro_days: 2
    meso_days: 3
    macro_days: 20
  options_flip:
    account_id: alpaca1
    enabled: false
    cron: 2/10 10-15 * * 1-5
    stop_loss_pct: 0.5
    max_hold_sessions: 5
    target_delta: 0.75
    entry_reach: 0.4
    exit_reach: 0.35
    entry_patience: 2
    exit_patience: 1.5
    exit_gain_share: 0.7
    min_profit_per_contract: 15
    level_lookback_days: 80
    min_trend_strength: 0.5
    min_dte: 10
    min_open_interest: 100
    max_spread_pct: 0.06
    gap_atr: 1
    max_annual_volatility: 0.8
    plan:
      call:
        amount: 3425
        items:
        - symbol: IBIT
          amount: 925
        - symbol: USO
          amount: 500
        - symbol: GLD
          amount: 2000
      put:
        amount: 0
        items: []
