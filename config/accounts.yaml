default: paper
accounts:
  items:
    paper:
      label: Alpaca Paper
      broker: alpaca
      api_key_env: ALPACA_API_KEY
      api_secret_env: ALPACA_API_SECRET
      base_url: https://paper-api.alpaca.markets
      data_feed: iex
    local_paper:
      # No broker, no keys, no network: fills are simulated locally against the last prices
      # the algorithm saw. Point an algorithm here to watch it trade before trusting it with
      # a real paper account.
      label: Local Paper
      broker: paper
