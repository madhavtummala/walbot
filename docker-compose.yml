services:
  walbot:
    image: ${WALBOT_IMAGE:-ghcr.io/madhavtummala/walbot:latest}
    container_name: walbot
    pull_policy: ${WALBOT_PULL_POLICY:-always}
    # Compose reads .env for ${...} substitution only -- without this the container gets none
    # of the credentials, so Alpaca, Alpha Vantage and Schwab are all silently unconfigured
    # inside it however complete the host's .env is.
    env_file:
      - .env
    environment:
      KILL_SWITCH: ${KILL_SWITCH:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      MCP_PORT: ${WALBOT_MCP_CONTAINER_PORT:-8001}
    command: ["${WALBOT_MODE:---bot}"]
    ports:
      # Loopback by default: the dashboard is unauthenticated, so it must not be reachable
      # around the reverse proxy on the host's public IP. Set WALBOT_BIND=0.0.0.0 only for
      # a trusted network with nothing in front. See Caddyfile.sample.
      - "${WALBOT_BIND:-127.0.0.1}:${WALBOT_PORT:-8000}:8000"
      - "${WALBOT_BIND:-127.0.0.1}:${WALBOT_MCP_PORT:-8001}:8001"
    volumes:
      - ${WALBOT_RUNTIME:-./runtime}/config:/config
      - ${WALBOT_RUNTIME:-./runtime}/data:/data
    restart: unless-stopped
