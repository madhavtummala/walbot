<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walbot</title>
  <link rel="stylesheet" href="/static/app.css?v=20260816-account-layout" />
</head>

<body>
  <button class="navToggle" id="navToggle" type="button" aria-label="Toggle navigation"
    aria-expanded="false">&#9776;</button>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main">
      <a class="brand" href="#/algo/dca/overview">Walbot</a>

      <section class="navGroup" aria-label="Algorithms">
        <span class="navGroupLabel">Algorithms</span>
        <ul class="navList" id="algorithmNav"></ul>
      </section>

      <section class="navGroup" aria-label="Accounts">
        <span class="navGroupLabel">Accounts</span>
        <ul class="navList" id="accountNav"></ul>
      </section>

      <div class="navFooter" id="navFooter"></div>
    </nav>

    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <input id="symbolEntry" autocomplete="off" autocapitalize="characters" spellcheck="false" />
  <!-- Typed budget for the selected bubble. Unlike #symbolEntry, whose text is transparent
       because the SVG redraws the symbol as you type, this one shows its own value: the
       amount is committed in one go rather than previewed. -->
  <input id="amountEntry" inputmode="numeric" autocomplete="off" spellcheck="false"
    aria-label="Monthly budget for the selected symbol" />
  <output id="toast" aria-live="polite"></output>
  <script src="/static/app.js?v=20260816-account-layout"></script>
</body>

</html>
