<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walbot</title>
  <link rel="stylesheet" href="/static/app.css?v=20260811-single-page" />
</head>

<body>
  <main>
    <button class="authPill" id="schwabAuthPill" type="button" hidden aria-live="polite">
      <span class="authDot" aria-hidden="true"></span>
      <span class="authLabel">Schwab</span>
    </button>

    <section id="algorithmRunPanel" aria-label="Algorithm runtime">
      <button class="iconButton powerButton" id="algorithmPowerToggle" type="button"
        aria-label="Toggle algorithm trading" aria-pressed="false" title="Algorithm trading">
        <span aria-hidden="true">&#9211;</span>
      </button>
      <select id="tradingAccount" aria-label="Trading account"></select>
    </section>

    <section id="schedulePanel" aria-label="DCA budget">
      <p id="planSummary">Dollars per month, per symbol.</p>
    </section>
    <svg id="bubbleBoard" role="img" aria-label="Interactive buy and sell DCA bubbles"></svg>

    <section class="deckPanel" id="algorithmPanel">
      <div class="deckFrame">
        <div class="deckControls" aria-hidden="true">
          <button class="deckArrow" type="button" data-deck="algorithm" data-direction="-1"
            aria-label="Previous algorithm">▲</button>
          <button class="deckArrow" type="button" data-deck="algorithm" data-direction="1"
            aria-label="Next algorithm">▼</button>
        </div>
        <section class="cardDeck" id="algorithmDeck" aria-label="Algorithm strategy cards" tabindex="0"></section>
      </div>
      <aside class="sideCard" id="algorithmSignalCard" aria-label="Current algorithm signals"></aside>
    </section>
  </main>

  <input id="symbolEntry" autocomplete="off" autocapitalize="characters" spellcheck="false" />
  <output id="toast" aria-live="polite"></output>
  <script src="/static/app.js?v=20260811-single-page"></script>
</body>

</html>
