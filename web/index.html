<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robo Trade</title>
  <link rel="stylesheet" href="/static/app.css?v=20260529-position-tooltip" />
</head>

<body>
  <main>
    <nav id="tabs" aria-label="Trading controls">
      <button class="tab active" type="button" data-tab="dca">DCA</button>
      <button class="tab" type="button" data-tab="algorithm">Algorithm</button>
      <button class="tab" type="button" data-tab="options">Options</button>
    </nav>

    <section class="tabPanel active" id="dcaTab" aria-label="DCA setup">
      <section id="schedulePanel" aria-label="DCA scheduling">
        <button class="iconButton powerButton" id="scheduleToggle" type="button" aria-label="Toggle DCA schedule"
          aria-pressed="false" title="DCA schedule">
          <span aria-hidden="true">&#9211;</span>
        </button>
        <input type="text" id="cronPattern" placeholder="0 12 * * 1-5" aria-label="Cron pattern for DCA scheduling" />
        <p id="cronDescription">Weekdays at 12:00 PM</p>
      </section>
      <svg id="bubbleBoard" role="img" aria-label="Interactive buy and sell DCA bubbles"></svg>
    </section>

    <section class="tabPanel" id="algorithmTab" aria-label="Algorithm setup">
      <section id="algorithmRunPanel" aria-label="Algorithm runtime">
        <button class="iconButton powerButton" id="algorithmPowerToggle" type="button"
          aria-label="Toggle algorithm trading" aria-pressed="false" title="Algorithm trading">
          <span aria-hidden="true">&#9211;</span>
        </button>
        <select id="tradingAccount" aria-label="Trading account"></select>
      </section>
      <section class="deckPanel" id="algorithmPanel">
        <div class="deckFrame">
          <div class="deckControls" aria-hidden="true">
            <button class="deckArrow" type="button" data-deck="algorithm" data-direction="-1"
              aria-label="Previous algorithm">▲</button>
            <button class="deckArrow" type="button" data-deck="algorithm" data-direction="1"
              aria-label="Next algorithm">▼</button>
          </div>
          <section class="cardDeck" id="algorithmDeck" aria-label="Algorithm strategy cards" tabindex="0"></section>
        </div>
        <aside class="sideCard" id="algorithmSignalCard" aria-label="Current algorithm signals"></aside>
      </section>
    </section>

    <section class="tabPanel" id="optionsTab" aria-label="Options setup">
      <section class="runPanel" id="optionsRunPanel" aria-label="Options runtime">
        <button class="iconButton powerButton" id="optionsPowerToggle" type="button"
          aria-label="Toggle options trading" aria-pressed="false" title="Options trading">
          <span aria-hidden="true">&#9211;</span>
        </button>
        <select id="optionsTradingAccount" aria-label="Options trading account"></select>
      </section>
      <section class="deckPanel" id="optionsPanel">
        <div class="deckFrame">
          <div class="deckControls" aria-hidden="true">
            <button class="deckArrow" type="button" data-deck="options" data-direction="-1"
              aria-label="Previous options">▲</button>
            <button class="deckArrow" type="button" data-deck="options" data-direction="1"
              aria-label="Next options">▼</button>
          </div>
          <section class="cardDeck" id="optionsDeck" aria-label="Options strategy cards" tabindex="0"></section>
        </div>
        <aside class="sideCard" id="optionsSignalCard" aria-label="Selected options strategy details"></aside>
      </section>
    </section>
  </main>

  <input id="symbolEntry" autocomplete="off" autocapitalize="characters" spellcheck="false" />
  <output id="toast" aria-live="polite"></output>
  <script src="/static/app.js?v=20260529-position-tooltip"></script>
</body>

</html>
